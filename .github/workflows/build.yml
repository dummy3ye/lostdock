name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lostdock-linux
          - os: windows-latest
            artifact: lostdock-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]" pyinstaller
          uv run python -m playwright install chromium

      - name: Build binary
        run: uv run pyinstaller lostdock.spec -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: uv run pyinstaller --onefile --windowed --name lostdock-installer src/installer/windows/main.py -y

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/lostdock/
          if-no-files-found: error

      - name: Generate self-signed certificate
        if: runner.os == 'Windows'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout sign-key.pem -out sign-cert.pem `
            -days 3650 -subj "/CN=waterw0rks" -addext "basicConstraints=critical,CA:FALSE" `
            -addext "keyUsage=digitalSignature" -addext "extendedKeyUsage=codeSigning"

      - name: Install osslsigncode
        if: runner.os == 'Windows'
        run: choco install osslsigncode -y

      - name: Self-sign installer
        if: runner.os == 'Windows'
        run: |
          osslsigncode sign -certs sign-cert.pem -key sign-key.pem `
            -n "waterw0rks" `
            -t http://timestamp.digicert.com `
            -in dist/lostdock-installer.exe -out dist/lostdock-installer-signed.exe

      - name: Upload signed installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lostdock-windows-installer
          path: dist/lostdock-installer-signed.exe
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: lostdock-linux
          path: linux/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lostdock-windows
          path: windows/

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: lostdock-windows-installer
          path: installer/
          merge-multiple: true

      - name: Normalize installer name
        run: |
          if [ -f installer/lostdock-installer-signed.exe ]; then
            mv installer/lostdock-installer-signed.exe installer/lostdock-installer.exe
          fi

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package archives
        run: |
          tar -czf "lostdock-linux-${{ steps.version.outputs.version }}.tar.gz" -C linux .
          (cd windows && zip -r "../lostdock-windows-${{ steps.version.outputs.version }}.zip" .)
          ls -lh lostdock-linux-*.tar.gz lostdock-windows-*.zip

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "LostDock v$VERSION" \
            --notes-file "${{ steps.git-cliff.outputs.changelog }}" \
            lostdock-linux-*.tar.gz lostdock-windows-*.zip installer/lostdock-installer.exe
